<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Çevrimdışı — GNC CRM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      text-align: center;
      max-width: 28rem;
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .logo {
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, #10b981, #0d9488);
      border-radius: 22px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      font-weight: 900;
      color: white;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.75rem; font-weight: 700; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; font-size: 0.95rem; }
    .button {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      background: linear-gradient(135deg, #10b981, #0d9488);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.5); }
    .button:active { transform: translateY(0); }
    .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.6; }
    .offline-icon {
      display: inline-block;
      padding: 8px 14px;
      background: rgba(148, 163, 184, 0.15);
      border-radius: 999px;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">G</div>
    <div class="offline-icon">⚡ Çevrimdışı</div>
    <h1>İnternet bağlantısı yok</h1>
    <p>
      GNC CRM şu anda çevrimdışı. Bağlantınızı kontrol edip tekrar deneyin.
      Önceden ziyaret ettiğiniz sayfalar aşağıdaki butona tıklayarak görüntülenebilir.
    </p>
    <a href="/" class="button">Tekrar Dene</a>
  </div>
  <script>
    // Online olunca otomatik yeniden dene
    window.addEventListener('online', () => window.location.reload())
  </script>
</body>
</html>
