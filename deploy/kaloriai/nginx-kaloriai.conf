# KaloriAI — nginx reverse proxy şablonu
# Kurulum:
#   1) server_name alanını kendi alan adınızla değiştirin
#   2) sudo cp nginx-kaloriai.conf /etc/nginx/sites-available/kaloriai
#   3) sudo ln -sf /etc/nginx/sites-available/kaloriai /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) sudo certbot --nginx -d alanadiniz.com   (TLS'i certbot ekler)

limit_req_zone $binary_remote_addr zone=kaloriai_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name alanadiniz.com www.alanadiniz.com;

    # Dosya yükleme sınırı — uygulama 10MB görsel limiti + multipart başlık payı
    client_max_body_size 12M;

    # gzip — JS/CSS/JSON için bant genişliği tasarrufu
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Statik önbellek (Next.js parmak izli asset'ler)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Service worker — asla cache'lenmesin (PWA güncellik kritik)
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache";
    }

    # API — hafif hız sınırlama (uygulama içi rate limiter'a ek katman)
    location /api/ {
        limit_req zone=kaloriai_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        # KRİTİK — uygulama içi rate limiter gerçek IP'yi buradan okur:
        # X-Real-IP proxy tarafından üzerine yazılır (spoof edilemez),
        # X-Forwarded-For'a uygulama yalnız SON elemana güvenir.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# NOT: certbot bu dosyaya 443 server bloğunu otomatik ekler.
# proxy_params içindeki şu satırlar UYGULAMA İÇİN KRİTİKTİR (Secure cookie):
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header Host $http_host;
